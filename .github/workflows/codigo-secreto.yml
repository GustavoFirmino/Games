name: Código Secreto — build

# Runners macOS são gratuitos em repositórios públicos.
# Como eu desenvolvo no Windows, é aqui que o projeto realmente compila.
on:
  push:
    paths:
      - 'CodigoSecreto/**'
      - '.github/workflows/codigo-secreto.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compilar
    runs-on: macos-15
    defaults:
      run:
        working-directory: CodigoSecreto

    steps:
      - uses: actions/checkout@v4

      - name: Versão do Xcode
        run: xcodebuild -version

      # O app nativo e a versão web compartilham o mesmo banco de palavras.
      # Se um for editado sem o outro, o build para aqui.
      - name: Conferir se words.json está sincronizado entre app e web
        run: |
          if ! diff -q CodigoSecreto/Resources/words.json web/words.json; then
            echo "::error::words.json divergiu. Rode: cp CodigoSecreto/Resources/words.json web/words.json"
            exit 1
          fi
          echo "words.json sincronizado ✓"

      - name: Compilar para o simulador (sem assinatura)
        run: |
          xcodebuild build \
            -project CodigoSecreto.xcodeproj \
            -scheme CodigoSecreto \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Gerar .ipa sem assinatura (para sideload via AltStore/SideStore)
        run: |
          xcodebuild archive \
            -project CodigoSecreto.xcodeproj \
            -scheme CodigoSecreto \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/CodigoSecreto.xcarchive" \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/CodigoSecreto.xcarchive/Products/Applications/CodigoSecreto.app" \
                "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qry CodigoSecreto-unsigned.ipa Payload

      - name: Publicar o .ipa como artefato
        uses: actions/upload-artifact@v4
        with:
          name: CodigoSecreto-unsigned-ipa
          path: ${{ runner.temp }}/CodigoSecreto-unsigned.ipa
          if-no-files-found: error
